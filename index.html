<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Everstar v0.2</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    width:320px;
    color:white;
    background:rgba(0,0,0,.75);
    padding:12px;
    border-radius:12px;
}

h2{
    margin:0 0 10px 0;
}
</style>
</head>
<body>

<div id="ui">
<h2>🌟 Everstar</h2>
<div id="location">World Map</div>
<div id="starsCount">Stars: 0</div>
<div id="quests"></div>
<div id="hint"></div>
</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
 canvas.width=window.innerWidth;
 canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let state="world";
let starsCollected=0;

const keys={};

document.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
});

document.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

const player={
 x:500,
 y:350,
 speed:5
};

const quests={
 earth:false,
 water:false,
 fire:false,
 air:false,
 forest:false
};

const realmStars=[];

function createStars(){
 realmStars.length=0;

 for(let i=0;i<10;i++){
  realmStars.push({
   x:100+Math.random()*(canvas.width-200),
   y:100+Math.random()*(canvas.height-200),
   taken:false
  });
 }
}

createStars();

function movePlayer(){

 if(keys["w"]||keys["arrowup"])
  player.y-=player.speed;

 if(keys["s"]||keys["arrowdown"])
  player.y+=player.speed;

 if(keys["a"]||keys["arrowleft"])
  player.x-=player.speed;

 if(keys["d"]||keys["arrowright"])
  player.x+=player.speed;

 player.x=Math.max(20,
 Math.min(canvas.width-20,player.x));

 player.y=Math.max(20,
 Math.min(canvas.height-20,player.y));
}

function drawHorse(){

 ctx.font="42px Arial";
 ctx.fillText("🐴",player.x,player.y);

}

function drawWorld(){

 ctx.fillStyle="#072443";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 for(let i=0;i<200;i++){

  ctx.fillStyle="white";

  ctx.fillRect(
   (i*101)%canvas.width,
   (i*71)%canvas.height,
   2,
   2
  );
 }

 const cx=canvas.width/2;
 const cy=canvas.height/2;

 ctx.strokeStyle="gold";
 ctx.lineWidth=10;

 ctx.beginPath();

 ctx.moveTo(cx,cy-220);
 ctx.lineTo(cx,cy);

 ctx.moveTo(cx,cy);
 ctx.lineTo(cx+220,cy);

 ctx.moveTo(cx,cy);
 ctx.lineTo(cx-220,cy);

 ctx.moveTo(cx,cy);
 ctx.lineTo(cx,cy+220);

 ctx.stroke();

 const realms=[
  {name:"earth",x:cx,y:cy-220,color:"#2e8b57",emoji:"🌎"},
  {name:"water",x:cx-220,y:cy,color:"#1e90ff",emoji:"🌊"},
  {name:"fire",x:cx+220,y:cy,color:"#ff4500",emoji:"🔥"},
  {name:"air",x:cx,y:cy+220,color:"#87cefa",emoji:"🌪️"}
 ];

 document.getElementById("hint").innerHTML="";

 realms.forEach(r=>{

  ctx.fillStyle=r.color;

  ctx.beginPath();
  ctx.arc(r.x,r.y,45,0,Math.PI*2);
  ctx.fill();

  ctx.font="28px Arial";
  ctx.fillStyle="white";
  ctx.fillText(r.emoji,r.x-15,r.y+10);

  const d=Math.hypot(
   player.x-r.x,
   player.y-r.y
  );

  if(d<70){

   document.getElementById("hint").innerHTML=
   "Press E to enter "+r.name+" realm";

   if(keys["e"]){

    state=r.name;

    if(state==="earth") quests.earth=true;
    if(state==="water") quests.water=true;
    if(state==="fire") quests.fire=true;
    if(state==="air") quests.air=true;

    player.x=canvas.width/2;
    player.y=canvas.height/2;

    createStars();

    keys["e"]=false;
   }
  }
 });

 ctx.font="72px Arial";
 ctx.fillText("⭐",cx-32,cy+25);

 drawHorse();
}

function drawStars(){

 realmStars.forEach(star=>{

  if(star.taken) return;

  ctx.font="28px Arial";
  ctx.fillText("⭐",star.x,star.y);

  const d=Math.hypot(
   player.x-star.x,
   player.y-star.y
  );

  if(d<35){

   star.taken=true;
   starsCollected++;
  }

 });
}

function drawNPC(text,x,y){

 ctx.font="38px Arial";
 ctx.fillText("🧙",x,y);

 if(Math.hypot(player.x-x,player.y-y)<60){

  document.getElementById("hint").innerHTML=
  text;
 }
}

function drawEarth(){

 ctx.fillStyle="#4b8f3c";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 for(let i=0;i<30;i++){

  ctx.fillStyle="darkgreen";

  ctx.beginPath();
  ctx.arc(
   (i*150)%canvas.width,
   (i*90)%canvas.height,
   22,
   0,
   Math.PI*2
  );
  ctx.fill();
 }

 drawNPC(
 "Earth Guardian: Strength comes from patience.",
 350,
 250
 );

 drawStars();
 drawHorse();
}

function drawWater(){

 ctx.fillStyle="#1b64d1";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 ctx.font="60px Arial";
 ctx.fillText("🦄",500,250);

 if(Math.hypot(player.x-500,player.y-250)<80){

  document.getElementById("hint").innerHTML=
  "A magical Unicorn greets you!";
 }

 drawNPC(
 "Water Guardian: Follow the rivers.",
 300,
 400
 );

 drawStars();
 drawHorse();
}

function drawFire(){

 ctx.fillStyle="#8b2a00";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 ctx.font="60px Arial";
 ctx.fillText("🐺",650,260);

 if(Math.hypot(player.x-650,player.y-260)<80){

  document.getElementById("hint").innerHTML=
  "Lava Wolf discovered!";
 }

 ctx.fillStyle="#ff6600";
 ctx.fillRect(780,180,140,140);

 ctx.fillStyle="white";
 ctx.font="20px Arial";
 ctx.fillText("DOOM FOREST",790,240);

 if(
  player.x>780 &&
  player.x<920 &&
  player.y>180 &&
  player.y<320
 ){
  document.getElementById("hint").innerHTML=
  "Press E for Deep Dark Forest";

  if(keys["e"]){

   quests.forest=true;

   state="doom";
   player.x=200;
   player.y=300;

   keys["e"]=false;
  }
 }

 drawNPC(
 "Fire Guardian: Beware the lava wolves.",
 350,
 350
 );

 drawStars();
 drawHorse();
}

function drawAir(){

 ctx.fillStyle="#80cfff";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 for(let i=0;i<8;i++){

  ctx.font="60px Arial";

  ctx.fillText(
   "☁️",
   i*170,
   120+(i%2)*130
  );
 }

 drawNPC(
 "Air Guardian: The winds know every path.",
 450,
 260
 );

 drawStars();
 drawHorse();
}

function drawDoom(){

 ctx.fillStyle="#103010";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 ctx.font="70px Arial";
 ctx.fillText("🌲",200,150);
 ctx.fillText("🌲",400,200);
 ctx.fillText("🌲",650,180);
 ctx.fillText("🌲",820,320);

 ctx.font="60px Arial";
 ctx.fillText("🐺",600,420);

 document.getElementById("hint").innerHTML=
 "Deep Dark Forest of Doom - Press B to escape";

 drawHorse();
}

function drawRealm(){

 document.getElementById("hint").innerHTML=
 "Press B to return";

 if(state==="earth") drawEarth();
 if(state==="water") drawWater();
 if(state==="fire") drawFire();
 if(state==="air") drawAir();
 if(state==="doom") drawDoom();

 if(keys["b"]){

  state="world";

  player.x=canvas.width/2;
  player.y=canvas.height/2;

  keys["b"]=false;
 }
}

function updateUI(){

 document.getElementById("location").innerHTML=
 "Location: "+state;

 document.getElementById("starsCount").innerHTML=
 "Stars: "+starsCollected;

 document.getElementById("quests").innerHTML=
 `
 ✅ Earth Realm: ${quests.earth?"Done":"..." }<br>
 ✅ Water Realm: ${quests.water?"Done":"..." }<br>
 ✅ Fire Realm: ${quests.fire?"Done":"..." }<br>
 ✅ Air Realm: ${quests.air?"Done":"..." }<br>
 ✅ Doom Forest: ${quests.forest?"Done":"..." }
 `;
}

function gameLoop(){

 movePlayer();

 updateUI();

 if(state==="world")
  drawWorld();
 else
  drawRealm();

 requestAnimationFrame(gameLoop);
}

gameLoop();

</script>
</body>
</html>
