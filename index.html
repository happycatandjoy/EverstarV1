<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Everstar Character Creator</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#87ceeb;
}

canvas{
    display:block;
}

#creator{
    position:absolute;
    inset:0;

    background:#0d203f;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:white;

    gap:10px;

    z-index:1000;
}

#creator input,
#creator select{
    padding:8px;
    width:200px;
}

#creator button{
    padding:10px 20px;
    font-size:16px;
}

#saveBtn{
    position:absolute;
    top:10px;
    right:10px;
    z-index:100;

    padding:10px;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;

    background:rgba(0,0,0,.6);

    color:white;

    padding:10px;

    border-radius:10px;
}

</style>
</head>
<body>

<div id="creator">

<h1>🌟 EVERSTAR 🌟</h1>

<input
id="playerName"
placeholder="Enter Name">

<select id="hairColor">
<option value="#3b2414">Brown Hair</option>
<option value="#111111">Black Hair</option>
<option value="#f4d03f">Blonde Hair</option>
<option value="#b03a2e">Red Hair</option>
</select>

<select id="skinColor">
<option value="#f5d7b2">Light Skin</option>
<option value="#d8a47f">Tan Skin</option>
<option value="#b97a56">Brown Skin</option>
<option value="#8d5524">Dark Skin</option>
</select>

<select id="eyeColor">
<option value="blue">Blue Eyes</option>
<option value="green">Green Eyes</option>
<option value="brown">Brown Eyes</option>
<option value="purple">Purple Eyes</option>
</select>

<select id="shirtColor">
<option value="#3498db">Blue Shirt</option>
<option value="#e74c3c">Red Shirt</option>
<option value="#2ecc71">Green Shirt</option>
<option value="#9b59b6">Purple Shirt</option>
</select>

<select id="faceStyle">
<option value="smile">Smile</option>
<option value="happy">Happy</option>
<option value="serious">Serious</option>
</select>

<button onclick="startGame()">
Begin Adventure
</button>

</div>

<div id="ui">
WASD to move
</div>

<button id="saveBtn">
💾 Save Progress
</button>

<canvas id="game"></canvas>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

function resize(){

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);

const keys = {};

document.addEventListener(
"keydown",
e=>{

keys[
e.key.toLowerCase()
] = true;

});

document.addEventListener(
"keyup",
e=>{

keys[
e.key.toLowerCase()
] = false;

});

let player = {

x:window.innerWidth/2,
y:window.innerHeight/2,

speed:4

};

let playerData = {

name:"Guardian",

hair:"#3b2414",

skin:"#f5d7b2",

eyes:"blue",

shirt:"#3498db",

face:"smile"

};

const saveData =
localStorage.getItem(
"everstarSave"
);

if(saveData){

try{

playerData =
JSON.parse(saveData);

}catch(err){}

}

function startGame(){

playerData.name =
document.getElementById(
"playerName"
).value || "Guardian";

playerData.hair =
document.getElementById(
"hairColor"
).value;

playerData.skin =
document.getElementById(
"skinColor"
).value;

playerData.eyes =
document.getElementById(
"eyeColor"
).value;

playerData.shirt =
document.getElementById(
"shirtColor"
).value;

playerData.face =
document.getElementById(
"faceStyle"
).value;

saveProgress();

document.getElementById(
"creator"
).style.display =
"none";

}

function saveProgress(){

localStorage.setItem(

"everstarSave",

JSON.stringify(
playerData
)

);

alert(
"🌟 Character Saved!"
);

}

document
.getElementById(
"saveBtn"
)
.addEventListener(
"click",
saveProgress
);

function movePlayer(){

if(keys["w"] ||
keys["arrowup"])
player.y -= player.speed;

if(keys["s"] ||
keys["arrowdown"])
player.y += player.speed;

if(keys["a"] ||
keys["arrowleft"])
player.x -= player.speed;

if(keys["d"] ||
keys["arrowright"])
player.x += player.speed;

}

function drawAvatar(){

const x = player.x;
const y = player.y;

// legs

ctx.fillStyle="#222";

ctx.fillRect(
x-8,
y+10,
5,
12
);

ctx.fillRect(
x+3,
y+10,
5,
12
);

// shirt

ctx.fillStyle=
playerData.shirt;

ctx.fillRect(
x-10,
y-6,
20,
20
);

// arms

ctx.fillRect(
x-16,
y,
6,
4
);

ctx.fillRect(
x+10,
y,
6,
4
);

// head

ctx.fillStyle=
playerData.skin;

ctx.beginPath();

ctx.arc(
x,
y-18,
10,
0,
Math.PI*2
);

ctx.fill();

// hair

ctx.fillStyle=
playerData.hair;

ctx.beginPath();

ctx.arc(
x,
y-22,
10,
Math.PI,
0
);

ctx.fill();

// eyes

ctx.fillStyle=
playerData.eyes;

ctx.fillRect(
x-4,
y-20,
2,
2
);

ctx.fillRect(
x+2,
y-20,
2,
2
);

// mouth

ctx.strokeStyle="black";

ctx.beginPath();

if(
playerData.face==="smile"
){

ctx.arc(
x,
y-14,
4,
0,
Math.PI
);

}
else if(
playerData.face==="happy"
){

ctx.arc(
x,
y-13,
5,
0,
Math.PI
);

}
else{

ctx.moveTo(
x-4,
y-13
);

ctx.lineTo(
x+4,
y-13
);

}

ctx.stroke();

// name

ctx.fillStyle="white";

ctx.font="14px Arial";

ctx.fillText(
playerData.name,
x-20,
y-35
);

}

function drawWorld(){

ctx.fillStyle="#4caf50";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

for(let i=0;i<25;i++){

ctx.fillStyle=
"darkgreen";

ctx.beginPath();

ctx.arc(
(i*90)%canvas.width,
(i*130)%canvas.height,
20,
0,
Math.PI*2
);

ctx.fill();

}

drawAvatar();

}

function loop(){

movePlayer();

drawWorld();

requestAnimationFrame(
loop
);

}

loop();

</script>

</body>
</html>
