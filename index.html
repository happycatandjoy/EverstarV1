<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Everstar</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial,sans-serif;
background:#4caf50;
}

canvas{
display:block;
}

#creator{
position:absolute;
inset:0;
background:#0d2045;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:10px;
color:white;
z-index:1000;
}

#creator input,
#creator select{
padding:10px;
width:220px;
}

#creator button{
padding:10px 20px;
}

#saveBtn{
position:absolute;
top:10px;
right:10px;
z-index:50;
padding:10px;
}

#joystick{
position:absolute;
left:20px;
bottom:20px;

width:140px;
height:140px;

background:rgba(255,255,255,.2);

border:3px solid white;
border-radius:50%;

touch-action:none;

z-index:100;
}

#stick{
position:absolute;

width:50px;
height:50px;

left:45px;
top:45px;

background:white;
border-radius:50%;
}

#ui{
position:absolute;
top:10px;
left:10px;
background:rgba(0,0,0,.6);
color:white;
padding:10px;
border-radius:10px;
z-index:50;
}

</style>
</head>
<body>

<div id="creator">

<h1>🌟 EVERSTAR 🌟</h1>

<input
id="playerName"
placeholder="Name">

<select id="hairColor">
<option value="#3b2414">Brown Hair</option>
<option value="#111111">Black Hair</option>
<option value="#f4d03f">Blonde Hair</option>
<option value="#b03a2e">Red Hair</option>
</select>

<select id="skinColor">
<option value="#f5d7b2">Light Skin</option>
<option value="#d8a47f">Tan Skin</option>
<option value="#b97a56">Brown Skin</option>
<option value="#8d5524">Dark Skin</option>
</select>

<select id="eyeColor">
<option value="blue">Blue Eyes</option>
<option value="green">Green Eyes</option>
<option value="brown">Brown Eyes</option>
<option value="purple">Purple Eyes</option>
</select>

<select id="shirtColor">
<option value="#3498db">Blue Shirt</option>
<option value="#e74c3c">Red Shirt</option>
<option value="#2ecc71">Green Shirt</option>
<option value="#9b59b6">Purple Shirt</option>
</select>

<select id="faceStyle">
<option value="smile">Smile</option>
<option value="happy">Happy</option>
<option value="serious">Serious</option>
</select>

<button onclick="startGame()">
Begin Adventure
</button>

</div>

<div id="ui">
🌟 Everstar Alpha
</div>

<button id="saveBtn">
💾 Save
</button>

<div id="joystick">
<div id="stick"></div>
</div>

<canvas id="game"></canvas>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

function resize(){

canvas.width=
window.innerWidth;

canvas.height=
window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);

let player={
x:300,
y:300,
speed:4
};

let playerData={

name:"Guardian",

hair:"#3b2414",

skin:"#f5d7b2",

eyes:"blue",

shirt:"#3498db",

face:"smile"

};

const save=
localStorage.getItem(
"everstarCharacter"
);

if(save){

playerData=
JSON.parse(save);

}

function saveProgress(){

localStorage.setItem(
"everstarCharacter",
JSON.stringify(
playerData
)
);

alert(
"🌟 Saved!"
);

}

document
.getElementById(
"saveBtn"
)
.addEventListener(
"click",
saveProgress
);

function startGame(){

playerData.name=
document.getElementById(
"playerName"
).value
|| "Guardian";

playerData.hair=
document.getElementById(
"hairColor"
).value;

playerData.skin=
document.getElementById(
"skinColor"
).value;

playerData.eyes=
document.getElementById(
"eyeColor"
).value;

playerData.shirt=
document.getElementById(
"shirtColor"
).value;

playerData.face=
document.getElementById(
"faceStyle"
).value;

saveProgress();

document.getElementById(
"creator"
).style.display=
"none";

}

let joyX=0;
let joyY=0;

let joystickActive=false;

const joystick=
document.getElementById(
"joystick"
);

const stick=
document.getElementById(
"stick"
);

joystick.addEventListener(
"touchstart",
()=>{
joystickActive=true;
}
);

joystick.addEventListener(
"touchmove",
e=>{

if(!joystickActive)
return;

const rect=
joystick.getBoundingClientRect();

const touch=
e.touches[0];

let dx=
touch.clientX-
rect.left-
70;

let dy=
touch.clientY-
rect.top-
70;

const distance=
Math.sqrt(
dx*dx+dy*dy
);

const max=45;

if(distance>max){

dx=
(dx/distance)
*max;

dy=
(dy/distance)
*max;

}

joyX=
dx/max;

joyY=
dy/max;

stick.style.left=
(45+dx)+"px";

stick.style.top=
(45+dy)+"px";

e.preventDefault();

});

function resetJoystick(){

joystickActive=false;

joyX=0;
joyY=0;

stick.style.left=
"45px";

stick.style.top=
"45px";

}

joystick.addEventListener(
"touchend",
resetJoystick
);

joystick.addEventListener(
"touchcancel",
resetJoystick
);

function movePlayer(){

player.x +=
joyX*
player.speed;

player.y +=
joyY*
player.speed;

}

function drawTrees(){

for(let i=0;i<25;i++){

const x=
(i*170)%canvas.width;

const y=
(i*110)%canvas.height;

ctx.fillStyle=
"#6d4c41";

ctx.fillRect(
x-5,
y,
10,
25
);

ctx.fillStyle=
"darkgreen";

ctx.beginPath();

ctx.arc(
x,
y,
20,
0,
Math.PI*2
);

ctx.fill();

}

}

function drawAvatar(){

const x=
player.x;

const y=
player.y;

ctx.fillStyle=
"#222";

ctx.fillRect(
x-8,
y+10,
5,
12
);

ctx.fillRect(
x+3,
y+10,
5,
12
);

ctx.fillStyle=
playerData.shirt;

ctx.fillRect(
x-10,
y-6,
20,
20
);

ctx.fillRect(
x-16,
y,
6,
4
);

ctx.fillRect(
x+10,
y,
6,
4
);

ctx.fillStyle=
playerData.skin;

ctx.beginPath();

ctx.arc(
x,
y-18,
10,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle=
playerData.hair;

ctx.beginPath();

ctx.arc(
x,
y-22,
10,
Math.PI,
0
);

ctx.fill();

ctx.fillStyle=
playerData.eyes;

ctx.fillRect(
x-4,
y-20,
2,
2
);

ctx.fillRect(
x+2,
y-20,
2,
2
);

ctx.strokeStyle=
"black";

ctx.beginPath();

if(
playerData.face==="smile"
){

ctx.arc(
x,
y-14,
4,
0,
Math.PI
);

}
else if(
playerData.face==="happy"
){

ctx.arc(
x,
y-13,
5,
0,
Math.PI
);

}
else{

ctx.moveTo(
x-4,
y-13
);

ctx.lineTo(
x+4,
y-13
);

}

ctx.stroke();

ctx.fillStyle=
"white";

ctx.font=
"14px Arial";

ctx.fillText(
playerData.name,
x-25,
y-35
);

}

function drawWorld(){

ctx.fillStyle=
"#4caf50";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

drawTrees();

drawAvatar();

}

function gameLoop(){

movePlayer();

drawWorld();

requestAnimationFrame(
gameLoop
);

}

gameLoop();

</script>
</body>
</html>
