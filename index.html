<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Everstar Alpha</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial,sans-serif;
background:#4caf50;
}

canvas{
display:block;
}

#creator{

position:absolute;
inset:0;

display:flex;
flex-direction:column;

align-items:center;
justify-content:center;

background:#102040;

color:white;

gap:10px;

z-index:1000;
}

#creator input,
#creator select{

padding:10px;
width:220px;

}

#creator button{

padding:10px 20px;

}

#ui{

position:absolute;
top:10px;
left:10px;

background:rgba(0,0,0,.6);

color:white;

padding:10px;

border-radius:10px;

z-index:100;

}

#saveBtn{

position:absolute;

top:10px;
right:10px;

padding:10px;

z-index:100;

}

#joystick{

position:absolute;

left:20px;
bottom:20px;

width:140px;
height:140px;

border-radius:50%;

border:4px solid white;

background:rgba(255,255,255,.15);

touch-action:none;

z-index:200;

}

#stick{

position:absolute;

left:45px;
top:45px;

width:50px;
height:50px;

border-radius:50%;

background:white;

}

</style>
</head>

<body>

<div id="creator">

<h1>🌟 Everstar</h1>

<input
id="playerName"
placeholder="Your Name">

<select id="hairColor">

<option value="#3b2414">
Brown Hair
</option>

<option value="#111111">
Black Hair
</option>

<option value="#f4d03f">
Blonde Hair
</option>

<option value="#b03a2e">
Red Hair
</option>

</select>

<select id="skinColor">

<option value="#f5d7b2">
Light Skin
</option>

<option value="#d8a47f">
Tan Skin
</option>

<option value="#b97a56">
Brown Skin
</option>

<option value="#8d5524">
Dark Skin
</option>

</select>

<select id="eyeColor">

<option value="blue">
Blue Eyes
</option>

<option value="green">
Green Eyes
</option>

<option value="brown">
Brown Eyes
</option>

<option value="purple">
Purple Eyes
</option>

</select>

<select id="shirtColor">

<option value="#3498db">
Blue Shirt
</option>

<option value="#e74c3c">
Red Shirt
</option>

<option value="#2ecc71">
Green Shirt
</option>

<option value="#9b59b6">
Purple Shirt
</option>

</select>

<button onclick="startGame()">
Begin Adventure
</button>

</div>

<div id="ui">

<div>🌟 Everstar</div>

<div id="realmText">
Main World
</div>

</div>

<button id="saveBtn">
💾 Save
</button>

<div id="joystick">
<div id="stick"></div>
</div>

<canvas id="game"></canvas>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

function resize(){

canvas.width=
window.innerWidth;

canvas.height=
window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);

let currentRealm =
"world";

let player = {

x:120,
y:120,

speed:5,

radius:30

};

let joyX = 0;
let joyY = 0;

let playerData = {

name:"Guardian",

hair:"#3b2414",

skin:"#f5d7b2",

eyes:"blue",

shirt:"#3498db"

};
// =====================
// SAVE / LOAD
// =====================

const save =
localStorage.getItem(
"everstarCharacter"
);

if(save){

try{

playerData =
JSON.parse(save);

}
catch(err){

console.log(err);

}

}

function saveProgress(){

localStorage.setItem(

"everstarCharacter",

JSON.stringify(
playerData
)

);

alert(
"🌟 Saved!"
);

}

document
.getElementById(
"saveBtn"
)
.onclick =
saveProgress;

// =====================
// CHARACTER CREATION
// =====================

function startGame(){

playerData.name =
document.getElementById(
"playerName"
).value
|| "Guardian";

playerData.hair =
document.getElementById(
"hairColor"
).value;

playerData.skin =
document.getElementById(
"skinColor"
).value;

playerData.eyes =
document.getElementById(
"eyeColor"
).value;

playerData.shirt =
document.getElementById(
"shirtColor"
).value;

saveProgress();

document
.getElementById(
"creator"
).style.display =
"none";

}

// =====================
// JOYSTICK
// =====================

const joystick =
document.getElementById(
"joystick"
);

const stick =
document.getElementById(
"stick"
);

function handleMove(
clientX,
clientY
){

const rect =
joystick.getBoundingClientRect();

let dx =
clientX -
rect.left -
70;

let dy =
clientY -
rect.top -
70;

const distance =
Math.sqrt(
dx*dx +
dy*dy
);

const max = 45;

if(distance > max){

dx =
(dx/distance)
* max;

dy =
(dy/distance)
* max;

}

joyX =
dx / max;

joyY =
dy / max;

stick.style.left =
(45 + dx) + "px";

stick.style.top =
(45 + dy) + "px";

}

joystick.addEventListener(
"touchstart",
e=>{

const touch =
e.touches[0];

handleMove(
touch.clientX,
touch.clientY
);

}
);

joystick.addEventListener(
"touchmove",
e=>{

const touch =
e.touches[0];

handleMove(
touch.clientX,
touch.clientY
);

e.preventDefault();

}
);

function resetJoystick(){

joyX = 0;
joyY = 0;

stick.style.left =
"45px";

stick.style.top =
"45px";

}

joystick.addEventListener(
"touchend",
resetJoystick
);

joystick.addEventListener(
"touchcancel",
resetJoystick
);

// =====================
// WORLD OBJECTS
// =====================

const walls = [

{
x:250,
y:150,
w:300,
h:25
},

{
x:250,
y:150,
w:25,
h:200
},

{
x:525,
y:150,
w:25,
h:200
},

{
x:250,
y:325,
w:120,
h:25
},

{
x:430,
y:325,
w:120,
h:25
}

];

const portals = [

{
realm:"earth",
x:400,
y:80,
color:"#2e8b57"
},

{
realm:"water",
x:80,
y:250,
color:"#2196f3"
},

{
realm:"fire",
x:720,
y:250,
color:"#ff5722"
},

{
realm:"air",
x:400,
y:500,
color:"#87ceeb"
}

];
// =====================
// MOVEMENT + COLLISION
// =====================

function movePlayer(){

let nextX =
player.x +
(joyX * player.speed);

let nextY =
player.y +
(joyY * player.speed);

let blocked = false;

if(currentRealm === "world"){

for(const wall of walls){

if(

nextX + player.radius > wall.x &&
nextX - player.radius < wall.x + wall.w &&

nextY + player.radius > wall.y &&
nextY - player.radius < wall.y + wall.h

){

blocked = true;

}

}

}

if(!blocked){

player.x = nextX;
player.y = nextY;

}

// keep player on screen

player.x = Math.max(
player.radius,
Math.min(
canvas.width-player.radius,
player.x
)
);

player.y = Math.max(
player.radius,
Math.min(
canvas.height-player.radius,
player.y
)
);

}

// =====================
// PLAYER
// =====================

function drawAvatar(){

// player body

ctx.fillStyle="#ff3333";

ctx.beginPath();

ctx.arc(
player.x,
player.y,
player.radius,
0,
Math.PI*2
);

ctx.fill();

// outline

ctx.strokeStyle="white";
ctx.lineWidth=4;
ctx.stroke();

// eyes

ctx.fillStyle="white";

ctx.beginPath();
ctx.arc(
player.x-8,
player.y-5,
3,
0,
Math.PI*2
);
ctx.fill();

ctx.beginPath();
ctx.arc(
player.x+8,
player.y-5,
3,
0,
Math.PI*2
);
ctx.fill();

// name

ctx.fillStyle="white";

ctx.font="18px Arial";

ctx.fillText(
playerData.name,
player.x-35,
player.y-45
);

}

// =====================
// REALM DRAWER
// =====================

function drawRealm(
color,
realmName
){

ctx.fillStyle=color;

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

// return portal

ctx.fillStyle="gold";

ctx.beginPath();

ctx.arc(
80,
80,
40,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="white";

ctx.font="16px Arial";

ctx.fillText(
"RETURN",
45,
140
);

if(
Math.hypot(
player.x-80,
player.y-80
)<50
){

currentRealm =
"world";

player.x = 400;
player.y = 250;

}

document
.getElementById(
"realmText"
).innerHTML =
realmName;

drawAvatar();

}
// =====================
// MAIN WORLD
// =====================

function drawWorld(){

ctx.fillStyle="#6db45e";
ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

// realm labels

document
.getElementById(
"realmText"
).innerHTML =
"⭐ Main World";

// star paths

ctx.strokeStyle="#d8c28a";
ctx.lineWidth=20;

ctx.beginPath();

ctx.moveTo(400,250);
ctx.lineTo(400,80);

ctx.moveTo(400,250);
ctx.lineTo(80,250);

ctx.moveTo(400,250);
ctx.lineTo(720,250);

ctx.moveTo(400,250);
ctx.lineTo(400,500);

ctx.stroke();

// guardian hall

ctx.fillStyle="#d0b04f";

ctx.fillRect(
280,
180,
240,
120
);

// hall title

ctx.fillStyle="black";

ctx.font="18px Arial";

ctx.fillText(
"GUARDIAN HALL",
315,
245
);

// walls

ctx.fillStyle="#999";

for(const wall of walls){

ctx.fillRect(
wall.x,
wall.y,
wall.w,
wall.h
);

}

// portals

for(const p of portals){

ctx.fillStyle =
p.color;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
50,
0,
Math.PI*2
);

ctx.fill();

ctx.strokeStyle="white";
ctx.lineWidth=4;
ctx.stroke();

ctx.fillStyle="white";
ctx.font="16px Arial";

ctx.fillText(
p.realm.toUpperCase(),
p.x-35,
p.y+80
);

// enter realm

if(
Math.hypot(
player.x-p.x,
player.y-p.y
)<60
){

currentRealm =
p.realm;

player.x =
canvas.width/2;

player.y =
canvas.height/2;

}

}

// decorative trees

for(let i=0;i<12;i++){

const tx =
100 +
(i*60);

const ty =
600;

ctx.fillStyle=
"#654321";

ctx.fillRect(
tx,
ty,
10,
20
);

ctx.fillStyle=
"darkgreen";

ctx.beginPath();

ctx.arc(
tx+5,
ty,
20,
0,
Math.PI*2
);

ctx.fill();

}

drawAvatar();

}
// =====================
// GAME LOOP
// =====================

function gameLoop(){

movePlayer();

if(currentRealm==="world"){

drawWorld();

}
else if(
currentRealm==="earth"
){

drawRealm(
"#2e8b57",
"🌎 Earth Realm"
);

// earth decorations

ctx.fillStyle="darkgreen";

for(let i=0;i<20;i++){

ctx.beginPath();

ctx.arc(
50+(i*40),
200+(i%4)*60,
20,
0,
Math.PI*2
);

ctx.fill();

}

}
else if(
currentRealm==="water"
){

drawRealm(
"#2196f3",
"🌊 Water Realm"
);

// lake

ctx.fillStyle=
"#64b5f6";

ctx.beginPath();

ctx.arc(
canvas.width/2,
canvas.height/2,
100,
0,
Math.PI*2
);

ctx.fill();

}
else if(
currentRealm==="fire"
){

drawRealm(
"#8b2a00",
"🔥 Fire Realm"
);

// volcano

ctx.fillStyle=
"#5d4037";

ctx.beginPath();

ctx.moveTo(
canvas.width/2-100,
canvas.height/2+80
);

ctx.lineTo(
canvas.width/2,
canvas.height/2-100
);

ctx.lineTo(
canvas.width/2+100,
canvas.height/2+80
);

ctx.fill();

// lava

ctx.fillStyle=
"orange";

ctx.fillRect(
canvas.width/2-20,
canvas.height/2-50,
40,
120
);

}
else if(
currentRealm==="air"
){

drawRealm(
"#87ceeb",
"🌪️ Air Realm"
);

// clouds

ctx.font="60px Arial";

ctx.fillText(
"☁️",
150,
200
);

ctx.fillText(
"☁️",
350,
300
);

ctx.fillText(
"☁️",
550,
200
);

ctx.fillText(
"☁️",
250,
450
);

}

requestAnimationFrame(
gameLoop
);

}

gameLoop();

</script>
</body>
</html>
