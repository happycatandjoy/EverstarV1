<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Everstar</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;

    background:
    linear-gradient(
        to bottom,
        #7bcfff,
        #95e98f
    );
}

#player{
    width:40px;
    height:40px;
    border-radius:50%;
    position:absolute;
    background:gold;
    border:3px solid white;
    z-index:50;
}

.animal{
    width:40px;
    height:40px;
    border-radius:50%;
    position:absolute;
}

.unicorn{
    background:white;
    border:2px solid pink;
}

.lavawolf{
    background:orangered;
    border:2px solid black;
}

#ui{
    position:absolute;
    top:10px;
    left:10px;
    background:white;
    padding:12px;
    border-radius:12px;
    z-index:100;

    max-width:260px;
}

#message{
    font-weight:bold;
    color:purple;
    margin-top:8px;
}

#joystick{
    position:fixed;
    bottom:30px;
    left:30px;

    width:120px;
    height:120px;

    border-radius:50%;
    background:rgba(255,255,255,.2);

    border:3px solid white;

    z-index:999;
    touch-action:none;
}

#stick{
    width:60px;
    height:60px;

    border-radius:50%;

    background:white;

    position:absolute;

    left:30px;
    top:30px;

    box-shadow:0 0 10px rgba(0,0,0,.4);
}

.region{
    position:absolute;
    font-weight:bold;
    color:white;
    text-shadow:2px 2px 2px black;
}

</style>
</head>

<body>

<div id="game">

<div id="ui">

<h2>🌟 Everstar</h2>

<div>
Guardian Rank:
<span id="rank">
Apprentice
</span>
</div>

<br>

<div>
Animals Found:
<span id="animalsFound">
0
</span>
</div>

<div id="message">
Explore Everstar!
</div>

</div>

<div id="player"></div>

<div class="animal unicorn"
style="left:300px;top:220px;">
</div>

<div class="animal lavawolf"
style="left:650px;top:350px;">
</div>

<div class="region"
style="top:120px;left:240px;">
🦄 Unicorn Falls
</div>

<div class="region"
style="top:300px;left:550px;">
🌋 Dark Forest of Doom
</div>

</div>

<div id="joystick">
<div id="stick"></div>
</div>

<script>

const player =
document.getElementById("player");

let x = 100;
let y = 100;

player.style.left = x + "px";
player.style.top = y + "px";

let animalsFound = 0;

const rank =
document.getElementById("rank");

const animalCounter =
document.getElementById("animalsFound");

const message =
document.getElementById("message");

function updatePlayer(){

    player.style.left = x + "px";
    player.style.top = y + "px";

    checkAnimals();
}

document.addEventListener(
"keydown",
(event)=>{

    const speed = 15;

    if(event.key==="ArrowUp")
        y-=speed;

    if(event.key==="ArrowDown")
        y+=speed;

    if(event.key==="ArrowLeft")
        x-=speed;

    if(event.key==="ArrowRight")
        x+=speed;

    updatePlayer();
});

function checkAnimals(){

    const animals =
    document.querySelectorAll(".animal");

    animals.forEach(animal=>{

        const ax = animal.offsetLeft;
        const ay = animal.offsetTop;

        const distance =
        Math.sqrt(
        (x-ax)*(x-ax) +
        (y-ay)*(y-ay));

        if(distance < 50){

            if(
            animal.style.display !==
            "none"
            ){

                animal.style.display =
                "none";

                animalsFound++;

                animalCounter.innerText =
                animalsFound;

                if(
                animal.classList.contains(
                "unicorn"
                )){
                    message.innerText =
                    "🦄 You befriended a Unicorn!";
                }

                if(
                animal.classList.contains(
                "lavawolf"
                )){
                    message.innerText =
                    "🐺 Lava Wolf discovered!";
                }

                if(animalsFound >= 2){

                    rank.innerText =
                    "Junior Guardian";

                    message.innerText =
                    "👑 You became a Junior Guardian!";
                }

            }

        }

    });

}

const joystick =
document.getElementById("joystick");

const stick =
document.getElementById("stick");

let dragging = false;

let joyX = 0;
let joyY = 0;

joystick.addEventListener(
"touchstart",
()=>{
    dragging = true;
}
);

joystick.addEventListener(
"touchmove",
(event)=>{

    if(!dragging)
    return;

    const touch =
    event.touches[0];

    const rect =
    joystick.getBoundingClientRect();

    let dx =
    touch.clientX -
    (rect.left + 60);

    let dy =
    touch.clientY -
    (rect.top + 60);

    const distance =
    Math.sqrt(dx*dx + dy*dy);

    if(distance > 40){

        dx =
        (dx/distance)*40;

        dy =
        (dy/distance)*40;

    }

    joyX = dx;
    joyY = dy;

    stick.style.left =
    (30+dx) + "px";

    stick.style.top =
    (30+dy) + "px";

},
{passive:false}
);

joystick.addEventListener(
"touchend",
()=>{

    dragging = false;

    joyX = 0;
    joyY = 0;

    stick.style.left =
    "30px";

    stick.style.top =
    "30px";

}
);

function gameLoop(){

    x += joyX * 0.12;
    y += joyY * 0.12;

    updatePlayer();

    requestAnimationFrame(
    gameLoop
    );

}

gameLoop();

</script>

</body>
</html>
