<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Everstar - Phase 1</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    background: #222;
}

#info {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,.7);
    color: white;
    padding: 10px;
    border-radius: 10px;
    max-width: 300px;
}
</style>
</head>
<body>

<div id="info">
<h2>🌟 Everstar</h2>
<p>Explore the island.</p>
<p>Move with WASD or Arrow Keys.</p>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const player = {
    x: canvas.width/2,
    y: canvas.height/2,
    size: 15,
    speed: 4
};

const keys = {};

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

const places = [
{
    name: "🌎 North Earth Realm",
    x: 300,
    y: 100,
    color: "#4caf50"
},
{
    name: "🌪️ South Air Realm",
    x: 300,
    y: 700,
    color: "#87ceeb"
},
{
    name: "🌊 West Water Realm",
    x: 50,
    y: 350,
    color: "#2196f3"
},
{
    name: "🔥 East Fire Realm",
    x: 850,
    y: 350,
    color: "#ff5722"
},
{
    name: "🏛 Town Square",
    x: 450,
    y: 350,
    color: "#ffd54f"
},
{
    name: "🌲 Deep Dark Forest of Doom",
    x: 700,
    y: 550,
    color: "#1b5e20"
}
];

const animals = [
{
    name: "🦄 Unicorn",
    x: 120,
    y: 260
},
{
    name: "🐺 Lava Wolf",
    x: 720,
    y: 560
},
{
    name: "🦅 Wind Eagle",
    x: 280,
    y: 650
},
{
    name: "🐉 Fire Dragon",
    x: 840,
    y: 200
},
{
    name: "🐢 Earth Tortoise",
    x: 250,
    y: 120
},
{
    name: "🐎 Water Horse",
    x: 60,
    y: 420
}
];

function update() {

    if(keys["w"] || keys["ArrowUp"])
        player.y -= player.speed;

    if(keys["s"] || keys["ArrowDown"])
        player.y += player.speed;

    if(keys["a"] || keys["ArrowLeft"])
        player.x -= player.speed;

    if(keys["d"] || keys["ArrowRight"])
        player.x += player.speed;

    let nearby = "Explore Everstar!";

    places.forEach(place => {

        const dx = player.x - place.x;
        const dy = player.y - place.y;

        if(Math.sqrt(dx*dx+dy*dy) < 50)
            nearby = place.name;
    });

    animals.forEach(animal => {

        const dx = player.x - animal.x;
        const dy = player.y - animal.y;

        if(Math.sqrt(dx*dx+dy*dy) < 40)
            nearby = animal.name;
    });

    document.getElementById("info").innerHTML =
    `
    <h2>🌟 Everstar</h2>
    <p>${nearby}</p>
    <p>Move: WASD / Arrow Keys</p>
    `;
}

function draw() {

    ctx.clearRect(0,0,canvas.width,canvas.height);

    places.forEach(place => {

        ctx.fillStyle = place.color;
        ctx.fillRect(place.x-30, place.y-30, 60, 60);

        ctx.fillStyle = "white";
        ctx.fillText(place.name, place.x-45, place.y-40);
    });

    animals.forEach(animal => {

        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(animal.x, animal.y, 10, 0, Math.PI*2);
        ctx.fill();

        ctx.fillText(animal.name, animal.x-30, animal.y-20);
    });

    ctx.fillStyle = "gold";
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.size, 0, Math.PI*2);
    ctx.fill();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
