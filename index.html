<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Everstar Alpha</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial;
background:#4caf50;
}

canvas{
display:block;
}

#creator{
position:absolute;
inset:0;
background:#102040;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:10px;
color:white;
z-index:1000;
}

#creator input,
#creator select{
padding:10px;
width:220px;
}

#ui{
position:absolute;
top:10px;
left:10px;
color:white;
background:rgba(0,0,0,.6);
padding:10px;
border-radius:8px;
z-index:100;
}

#saveBtn{
position:absolute;
top:10px;
right:10px;
z-index:100;
padding:10px;
}

#joystick{
position:absolute;
left:20px;
bottom:20px;
width:140px;
height:140px;
background:rgba(255,255,255,.15);
border:3px solid white;
border-radius:50%;
z-index:150;
touch-action:none;
}

#stick{
position:absolute;
left:45px;
top:45px;
width:50px;
height:50px;
background:white;
border-radius:50%;
}

</style>
</head>
<body>

<div id="creator">

<h1>🌟 Everstar 🌟</h1>

<input id="playerName"
placeholder="Your Name">

<select id="hairColor">
<option value="#3b2414">Brown Hair</option>
<option value="#111111">Black Hair</option>
<option value="#f4d03f">Blonde Hair</option>
<option value="#b03a2e">Red Hair</option>
</select>

<select id="skinColor">
<option value="#f5d7b2">Light Skin</option>
<option value="#d8a47f">Tan Skin</option>
<option value="#b97a56">Brown Skin</option>
<option value="#8d5524">Dark Skin</option>
</select>

<select id="eyeColor">
<option value="blue">Blue Eyes</option>
<option value="green">Green Eyes</option>
<option value="brown">Brown Eyes</option>
<option value="purple">Purple Eyes</option>
</select>

<select id="shirtColor">
<option value="#3498db">Blue Shirt</option>
<option value="#e74c3c">Red Shirt</option>
<option value="#2ecc71">Green Shirt</option>
<option value="#9b59b6">Purple Shirt</option>
</select>

<button onclick="startGame()">
Begin Adventure
</button>

</div>

<div id="ui">
🌟 Everstar
<div id="realmText">
Main World
</div>
</div>

<button id="saveBtn">
💾 Save
</button>

<div id="joystick">
<div id="stick"></div>
</div>

<canvas id="game"></canvas>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

function resize(){
canvas.width=
window.innerWidth;
canvas.height=
window.innerHeight;
}

resize();
window.addEventListener(
"resize",
resize
);

let currentRealm =
"world";

let player = {

x:300,
y:300,
speed:4

};

let playerData = {

name:"Guardian",
hair:"#3b2414",
skin:"#f5d7b2",
eyes:"blue",
shirt:"#3498db"

};
const save =
localStorage.getItem(
"everstarCharacter"
);

if(save){

playerData =
JSON.parse(save);

}

function saveProgress(){

localStorage.setItem(
"everstarCharacter",
JSON.stringify(
playerData
)
);

alert("Saved!");

}

document
.getElementById(
"saveBtn"
)
.onclick=
saveProgress;

function startGame(){

playerData.name =
document.getElementById(
"playerName"
).value
|| "Guardian";

playerData.hair =
document.getElementById(
"hairColor"
).value;

playerData.skin =
document.getElementById(
"skinColor"
).value;

playerData.eyes =
document.getElementById(
"eyeColor"
).value;

playerData.shirt =
document.getElementById(
"shirtColor"
).value;

saveProgress();

document
.getElementById(
"creator"
).style.display=
"none";
}

let joyX = 0;
let joyY = 0;

const joystick =
document.getElementById(
"joystick"
);

const stick =
document.getElementById(
"stick"
);

joystick.addEventListener(
"touchmove",
e=>{

const rect =
joystick.getBoundingClientRect();

const touch =
e.touches[0];

let dx =
touch.clientX -
rect.left -
70;

let dy =
touch.clientY -
rect.top -
70;

const dist =
Math.sqrt(
dx*dx+dy*dy
);

const max=45;

if(dist>max){

dx=(dx/dist)*max;
dy=(dy/dist)*max;

}

joyX=dx/max;
joyY=dy/max;

stick.style.left=
(45+dx)+"px";

stick.style.top=
(45+dy)+"px";

e.preventDefault();

});

function resetJoystick(){

joyX=0;
joyY=0;

stick.style.left="45px";
stick.style.top="45px";

}

joystick.addEventListener(
"touchend",
resetJoystick
);

const walls=[

{x:250,y:150,w:300,h:25},
{x:250,y:150,w:25,h:200},
{x:525,y:150,w:25,h:200},
{x:250,y:325,w:120,h:25},
{x:430,y:325,w:120,h:25}

];

const portals=[

{
realm:"earth",
x:400,
y:80,
color:"#2e8b57"
},

{
realm:"water",
x:80,
y:250,
color:"#2196f3"
},

{
realm:"fire",
x:720,
y:250,
color:"#ff5722"
},

{
realm:"air",
x:400,
y:500,
color:"#87ceeb"
}

];
function movePlayer(){

let nextX =
player.x +
joyX *
player.speed;

let nextY =
player.y +
joyY *
player.speed;

let blocked=false;

if(currentRealm==="world"){

for(const wall of walls){

if(

nextX+10 > wall.x &&
nextX-10 < wall.x+wall.w &&
nextY+10 > wall.y &&
nextY-10 < wall.y+wall.h

){

blocked=true;

}

}

}

if(!blocked){

player.x=nextX;
player.y=nextY;

}

}

function drawAvatar(){

ctx.fillStyle=
playerData.shirt;

ctx.fillRect(
player.x-10,
player.y-10,
20,
20
);

ctx.fillStyle=
playerData.skin;

ctx.beginPath();
ctx.arc(
player.x,
player.y-15,
10,
0,
Math.PI*2
);
ctx.fill();

ctx.fillStyle=
playerData.hair;

ctx.fillRect(
player.x-10,
player.y-25,
20,
8
);

ctx.fillStyle=
playerData.eyes;

ctx.fillRect(
player.x-4,
player.y-18,
2,
2
);

ctx.fillRect(
player.x+3,
player.y-18,
2,
2
);

ctx.fillStyle=
"white";

ctx.fillText(
playerData.name,
player.x-25,
player.y-35
);

}

function drawRealm(color,name){

ctx.fillStyle=color;
ctx.fillRect(
0,0,
canvas.width,
canvas.height
);

document
.getElementById(
"realmText"
).innerHTML =
name;

ctx.fillStyle="gold";
ctx.beginPath();
ctx.arc(80,80,35,0,Math.PI*2);
ctx.fill();

if(
Math.hypot(
player.x-80,
player.y-80
)<40
){

currentRealm="world";

player.x=400;
player.y=250;

}

drawAvatar();

}

function drawWorld(){

ctx.fillStyle="#4caf50";
ctx.fillRect(
0,0,
canvas.width,
canvas.height
);

document
.getElementById(
"realmText"
).innerHTML =
"Main World";

ctx.fillStyle="#999";

for(const wall of walls){

ctx.fillRect(
wall.x,
wall.y,
wall.w,
wall.h
);

}

ctx.fillStyle="#d4af37";

ctx.fillRect(
280,
180,
240,
120
);

for(const p of portals){

ctx.fillStyle=
p.color;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
35,
0,
Math.PI*2
);

ctx.fill();

if(
Math.hypot(
player.x-p.x,
player.y-p.y
)<40
){

currentRealm=
p.realm;

player.x=
canvas.width/2;

player.y=
canvas.height/2;

}

}

drawAvatar();

}

function gameLoop(){

movePlayer();

if(currentRealm==="world")
drawWorld();

if(currentRealm==="earth")
drawRealm(
"#2e8b57",
"Earth Realm"
);

if(currentRealm==="water")
drawRealm(
"#2196f3",
"Water Realm"
);

if(currentRealm==="fire")
drawRealm(
"#8b2a00",
"Fire Realm"
);

if(currentRealm==="air")
drawRealm(
"#87ceeb",
"Air Realm"
);

requestAnimationFrame(
gameLoop
);

}

gameLoop();

</script>
</body>
</html>
