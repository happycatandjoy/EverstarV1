<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Everstar</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#030818;
    font-family:Trebuchet MS,sans-serif;
}

canvas{
    display:block;
}

#panel{
    position:absolute;
    left:10px;
    top:10px;
    width:280px;

    background:rgba(0,0,0,.65);
    color:white;

    padding:12px;
    border-radius:12px;
    border:1px solid #5af;
}

h2{
    margin-top:0;
}

.quest{
    color:#ccc;
}

.complete{
    color:#7CFC00;
}
</style>
</head>
<body>

<div id="panel">
    <h2>🌟 EVERSTAR</h2>

    <div id="location">
        Explore the island...
    </div>

    <hr>

    <b>Quests</b>

    <div id="quests"></div>
</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.addEventListener("resize",()=>{
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
});

const centerX = canvas.width/2;
const centerY = canvas.height/2;

const player={
    x:centerX,
    y:centerY,
    r:12,
    speed:4
};

const keys={};

document.addEventListener("keydown",e=>{
    keys[e.key]=true;
});

document.addEventListener("keyup",e=>{
    keys[e.key]=false;
});

const quests={
    earth:false,
    water:false,
    fire:false,
    air:false,
    forest:false
};

const places=[

{
    name:"🌟 Everstar Plaza",
    x:centerX,
    y:centerY,
    color:"#FFD700",
    size:40
},

{
    name:"🌎 Earth Realm",
    x:centerX,
    y:centerY-230,
    color:"#4CAF50",
    size:50
},

{
    name:"🌊 Water Realm",
    x:centerX-230,
    y:centerY,
    color:"#2196F3",
    size:50
},

{
    name:"🔥 Fire Realm",
    x:centerX+230,
    y:centerY,
    color:"#FF5722",
    size:50
},

{
    name:"🌪️ Air Realm",
    x:centerX,
    y:centerY+230,
    color:"#87CEEB",
    size:50
},

{
    name:"🌲 Deep Dark Forest of Doom",
    x:centerX+140,
    y:centerY+120,
    color:"#145A32",
    size:65
}

];

const animals=[

{
    name:"🦄 Unicorn",
    x:centerX-270,
    y:centerY-60
},

{
    name:"🐢 Earth Tortoise",
    x:centerX,
    y:centerY-300
},

{
    name:"🐎 Water Horse",
    x:centerX-290,
    y:centerY+70
},

{
    name:"🐉 Fire Dragon",
    x:centerX+290,
    y:centerY-70
},

{
    name:"🐺 Lava Wolf",
    x:centerX+170,
    y:centerY+140
},

{
    name:"🦅 Wind Eagle",
    x:centerX+40,
    y:centerY+310
}

];

const stars=[];

for(let i=0;i<200;i++){

    stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*2
    });

}

function drawStars(){

    ctx.fillStyle="white";

    for(let s of stars){

        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
    }
}

function update(){

    if(keys["w"]||keys["ArrowUp"])
        player.y-=player.speed;

    if(keys["s"]||keys["ArrowDown"])
        player.y+=player.speed;

    if(keys["a"]||keys["ArrowLeft"])
        player.x-=player.speed;

    if(keys["d"]||keys["ArrowRight"])
        player.x+=player.speed;

    let location="Exploring Everstar";

    for(let p of places){

        const dx=player.x-p.x;
        const dy=player.y-p.y;

        if(Math.hypot(dx,dy)<60){

            location=p.name;

            if(p.name.includes("Earth"))
                quests.earth=true;

            if(p.name.includes("Water"))
                quests.water=true;

            if(p.name.includes("Fire"))
                quests.fire=true;

            if(p.name.includes("Air"))
                quests.air=true;

            if(p.name.includes("Forest"))
                quests.forest=true;
        }
    }

    document.getElementById("location").innerHTML=
    "<b>"+location+"</b>";

    document.getElementById("quests").innerHTML=
    `
    <div class="${quests.earth?'complete':'quest'}">
    ${quests.earth?'✅':'⬜'} Visit Earth Realm
    </div>

    <div class="${quests.water?'complete':'quest'}">
    ${quests.water?'✅':'⬜'} Visit Water Realm
    </div>

    <div class="${quests.fire?'complete':'quest'}">
    ${quests.fire?'✅':'⬜'} Visit Fire Realm
    </div>

    <div class="${quests.air?'complete':'quest'}">
    ${quests.air?'✅':'⬜'} Visit Air Realm
    </div>

    <div class="${quests.forest?'complete':'quest'}">
    ${quests.forest?'✅':'⬜'} Enter Doom Forest
    </div>
    `;
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawStars();

    // star roads

    ctx.strokeStyle="#777";
    ctx.lineWidth=6;

    ctx.beginPath();
    ctx.moveTo(centerX,centerY);
    ctx.lineTo(centerX,centerY-230);

    ctx.moveTo(centerX,centerY);
    ctx.lineTo(centerX-230,centerY);

    ctx.moveTo(centerX,centerY);
    ctx.lineTo(centerX+230,centerY);

    ctx.moveTo(centerX,centerY);
    ctx.lineTo(centerX,centerY+230);

    ctx.stroke();

    for(let p of places){

        ctx.fillStyle=p.color;

        ctx.beginPath();
        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );
        ctx.fill();

        ctx.fillStyle="white";
        ctx.fillText(
            p.name,
            p.x-55,
            p.y-(p.size+15)
        );
    }

    for(let a of animals){

        ctx.fillStyle="white";

        ctx.beginPath();
        ctx.arc(a.x,a.y,10,0,Math.PI*2);
        ctx.fill();

        ctx.fillText(
            a.name,
            a.x-25,
            a.y-15
        );
    }

    // player

    ctx.fillStyle="gold";

    ctx.beginPath();
    ctx.arc(
        player.x,
        player.y,
        player.r,
        0,
        Math.PI*2
    );
    ctx.fill();

    ctx.strokeStyle="white";
    ctx.stroke();
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
