<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Everstar Beta</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#111;
}

canvas{
    display:block;
}

#creator{

    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    gap:10px;

    background:#102040;

    color:white;

    z-index:1000;

}

#creator input,
#creator select{

    width:220px;

    padding:10px;

}

#ui{

    position:absolute;

    top:10px;
    left:10px;

    color:white;

    background:rgba(0,0,0,.7);

    padding:10px;

    border-radius:10px;

    z-index:100;

}

#joystick{

    position:absolute;

    left:20px;
    bottom:20px;

    width:140px;
    height:140px;

    border-radius:50%;

    border:4px solid white;

    background:rgba(255,255,255,.15);

    touch-action:none;

    z-index:200;

}

#stick{

    position:absolute;

    left:45px;
    top:45px;

    width:50px;
    height:50px;

    border-radius:50%;

    background:white;

}

#saveBtn{

    position:absolute;

    right:10px;
    top:10px;

    padding:10px;

    z-index:100;

}

</style>
</head>

<body>

<div id="creator">

<h1>🌟 EVERSTAR BETA</h1>

<input
id="playerName"
placeholder="Your Name">

<select id="hairColor">

<option value="#3b2414">
Brown Hair
</option>

<option value="#111111">
Black Hair
</option>

<option value="#f4d03f">
Blonde Hair
</option>

<option value="#b03a2e">
Red Hair
</option>

</select>

<button onclick="startGame()">
Begin Adventure
</button>

</div>

<div id="ui">

<div id="areaName">
⭐ Everstar Meadow
</div>

</div>

<button id="saveBtn">
💾 Save
</button>

<div id="joystick">
<div id="stick"></div>
</div>

<canvas id="game"></canvas>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

function resize(){

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);

// HUGE WORLD

const world = {

    width:3000,
    height:3000

};

// PLAYER LIVES
// INSIDE THE WORLD

let player = {

    x:1500,
    y:1500,

    speed:6,

    radius:28

};

// CAMERA

let camera = {

    x:0,
    y:0

};

let joyX = 0;
let joyY = 0;

let playerData = {

    name:"Guardian",
    hair:"#3b2414"

};
// =====================
// CHARACTER + SAVE
// =====================

const saveData =
localStorage.getItem(
"everstarBetaSave"
);

if(saveData){

try{

playerData =
JSON.parse(saveData);

}
catch(error){

console.log(error);

}

}

function saveProgress(){

localStorage.setItem(

"everstarBetaSave",

JSON.stringify(
playerData
)

);

}

document
.getElementById(
"saveBtn"
)
.onclick =
saveProgress;

function startGame(){

playerData.name =
document.getElementById(
"playerName"
).value
|| "Guardian";

playerData.hair =
document.getElementById(
"hairColor"
).value;

saveProgress();

document
.getElementById(
"creator"
).style.display =
"none";

}

// =====================
// MOBILE JOYSTICK
// =====================

const joystick =
document.getElementById(
"joystick"
);

const stick =
document.getElementById(
"stick"
);

function updateJoystick(
clientX,
clientY
){

const rect =
joystick.getBoundingClientRect();

let dx =
clientX -
rect.left -
70;

let dy =
clientY -
rect.top -
70;

const distance =
Math.sqrt(
(dx*dx)+
(dy*dy)
);

const max = 45;

if(distance > max){

dx =
(dx / distance)
* max;

dy =
(dy / distance)
* max;

}

joyX = dx / max;
joyY = dy / max;

stick.style.left =
(45 + dx)
+ "px";

stick.style.top =
(45 + dy)
+ "px";

}

joystick.addEventListener(
"touchstart",
e=>{

const touch =
e.touches[0];

updateJoystick(
touch.clientX,
touch.clientY
);

}
);

joystick.addEventListener(
"touchmove",
e=>{

const touch =
e.touches[0];

updateJoystick(
touch.clientX,
touch.clientY
);

e.preventDefault();

}
);

function resetJoystick(){

joyX = 0;
joyY = 0;

stick.style.left =
"45px";

stick.style.top =
"45px";

}

joystick.addEventListener(
"touchend",
resetJoystick
);

joystick.addEventListener(
"touchcancel",
resetJoystick
);

// =====================
// CAMERA
// =====================

function updateCamera(){

camera.x =

player.x -

(canvas.width / 2);

camera.y =

player.y -

(canvas.height / 2);

}
// =====================
// EVERSTAR WORLD DATA
// =====================

// giant scrolling world

const trees = [];

for(let i=0;i<120;i++){

trees.push({

x:Math.random() * world.width,

y:Math.random() * world.height

});

}

// star roads

const roads = [

{
x1:1500,
y1:700,
x2:1500,
y2:1500
},

{
x1:700,
y1:1500,
x2:1500,
y2:1500
},

{
x1:1500,
y1:1500,
x2:2300,
y2:1500
},

{
x1:1500,
y1:1500,
x2:1500,
y2:2300
}

];

// realm locations

const realms = [

{
name:"Earth Realm",
x:1500,
y:700,
color:"#2e8b57"
},

{
name:"Water Realm",
x:700,
y:1500,
color:"#2196f3"
},

{
name:"Fire Realm",
x:2300,
y:1500,
color:"#ff5722"
},

{
name:"Air Realm",
x:1500,
y:2300,
color:"#87ceeb"
}

];

// =====================
// PLAYER MOVEMENT
// =====================

function movePlayer(){

player.x +=
joyX * player.speed;

player.y +=
joyY * player.speed;

// keep player
// inside giant world

player.x = Math.max(
0,
Math.min(
world.width,
player.x
)
);

player.y = Math.max(
0,
Math.min(
world.height,
player.y
)
);

}

// =====================
// CAMERA FOLLOW
// =====================

function updateCamera(){

camera.x =
player.x -
(canvas.width/2);

camera.y =
player.y -
(canvas.height/2);

// stop camera leaving map

camera.x =
Math.max(
0,
Math.min(
world.width -
canvas.width,
camera.x
)
);

camera.y =
Math.max(
0,
Math.min(
world.height -
canvas.height,
camera.y
)
);

}
// =====================
// DRAW WORLD
// =====================

function drawWorld(){

// grass world

ctx.fillStyle =
"#5cae55";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

// roads

ctx.strokeStyle =
"#d8c28a";

ctx.lineWidth = 40;

for(const road of roads){

ctx.beginPath();

ctx.moveTo(
road.x1 - camera.x,
road.y1 - camera.y
);

ctx.lineTo(
road.x2 - camera.x,
road.y2 - camera.y
);

ctx.stroke();

}

// Everstar Plaza

ctx.fillStyle =
"gold";

ctx.beginPath();

ctx.arc(
1500 - camera.x,
1500 - camera.y,
120,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle =
"black";

ctx.font =
"24px Arial";

ctx.fillText(
"EVERSTAR PLAZA",
1400 - camera.x,
1500 - camera.y
);

// Guardian Hall

ctx.fillStyle =
"#d1b15b";

ctx.fillRect(
1380 - camera.x,
1420 - camera.y,
240,
140
);

ctx.strokeStyle =
"#444";

ctx.lineWidth = 4;

ctx.strokeRect(
1380 - camera.x,
1420 - camera.y,
240,
140
);

ctx.fillStyle =
"black";

ctx.fillText(
"GUARDIAN HALL",
1415 - camera.x,
1495 - camera.y
);

// trees

for(const tree of trees){

ctx.fillStyle =
"#6d4c41";

ctx.fillRect(
tree.x - camera.x - 5,
tree.y - camera.y,
10,
20
);

ctx.fillStyle =
"darkgreen";

ctx.beginPath();

ctx.arc(
tree.x - camera.x,
tree.y - camera.y,
18,
0,
Math.PI*2
);

ctx.fill();

}

// realm portals

for(const realm of realms){

ctx.fillStyle =
realm.color;

ctx.beginPath();

ctx.arc(
realm.x - camera.x,
realm.y - camera.y,
60,
0,
Math.PI*2
);

ctx.fill();

ctx.strokeStyle =
"white";

ctx.lineWidth = 5;

ctx.stroke();

ctx.fillStyle =
"white";

ctx.font =
"18px Arial";

ctx.fillText(
realm.name,
realm.x - camera.x - 45,
realm.y - camera.y + 95
);

const distance =
Math.hypot(
player.x - realm.x,
player.y - realm.y
);

if(distance < 70){

document
.getElementById(
"areaName"
).innerHTML =
"⭐ Tap portal area";

currentPortal =
realm.name;

}

}

}
// =====================
// PLAYER RENDER
// =====================

function drawPlayer(){

// player is ALWAYS
// drawn in screen center

const screenX =
canvas.width / 2;

const screenY =
canvas.height / 2;

// body

ctx.fillStyle =
"#ff4444";

ctx.beginPath();

ctx.arc(
screenX,
screenY,
28,
0,
Math.PI * 2
);

ctx.fill();

// outline

ctx.strokeStyle =
"white";

ctx.lineWidth = 4;

ctx.stroke();

// eyes

ctx.fillStyle =
"white";

ctx.beginPath();
ctx.arc(
screenX - 8,
screenY - 5,
3,
0,
Math.PI*2
);
ctx.fill();

ctx.beginPath();
ctx.arc(
screenX + 8,
screenY - 5,
3,
0,
Math.PI*2
);
ctx.fill();

// hair

ctx.fillStyle =
playerData.hair;

ctx.beginPath();

ctx.arc(
screenX,
screenY - 15,
20,
Math.PI,
0
);

ctx.fill();

// player name

ctx.fillStyle =
"white";

ctx.font =
"18px Arial";

ctx.fillText(
playerData.name,
screenX - 40,
screenY - 45
);

}

// =====================
// GAME LOOP
// =====================

function gameLoop(){

movePlayer();

updateCamera();

drawWorld();

drawPlayer();

requestAnimationFrame(
gameLoop
);

}

gameLoop();

</script>

</body>
</html>
