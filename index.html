<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Everstar v0.2</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial,sans-serif;
touch-action:none;
background:black;
}

#viewport{
width:100vw;
height:100vh;
overflow:hidden;
position:relative;
}

#game{
position:relative;
width:4000px;
height:4000px;

background:
linear-gradient(
to bottom,
#7bcfff,
#95e98f
);
}

#regionLabel{
position:absolute;
top:10px;
right:10px;
z-index:1000;

background:white;
padding:10px;
border-radius:10px;
}

#player{
position:absolute;
width:60px;
height:60px;

background:#f5d6b2;

border-radius:50%;

z-index:100;
}

.eye{
width:10px;
height:10px;
border-radius:50%;
background:blue;
position:absolute;
top:20px;
}

#leftEye{
left:16px;
}

#rightEye{
right:16px;
}

#ui{
position:fixed;
left:10px;
top:10px;

background:white;
padding:10px;

border-radius:10px;

z-index:9999;
max-width:260px;
}

#message{
margin-top:10px;
font-weight:bold;
color:purple;
}

#region{
font-weight:bold;
position:absolute;
font-size:24px;
color:white;
text-shadow:2px 2px 4px black;
}

.animal{
position:absolute;
width:40px;
height:40px;
border-radius:50%;
}

.unicorn{
background:white;
border:2px solid pink;
}

.lavawolf{
background:orangered;
}

#sage{
position:absolute;
width:50px;
height:50px;

background:purple;

border-radius:50%;
}

#joystick{
position:fixed;
left:25px;
bottom:25px;

width:120px;
height:120px;

border-radius:50%;

background:
rgba(255,255,255,.2);

border:3px solid white;

z-index:2000;
}

#stick{
position:absolute;

width:60px;
height:60px;

left:30px;
top:30px;

border-radius:50%;
background:white;
}

#characterScreen{
position:fixed;
inset:0;

background:#111;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

color:white;

z-index:10000;
}

select,button{
padding:10px;
font-size:18px;
}

</style>
</head>

<body>

<div id="characterScreen">

<h1>🌟 EVERSTAR 🌟</h1>

<p>Select Your Element</p>

<select id="element">

<option>Fire</option>
<option>Water</option>
<option>Earth</option>
<option>Air</option>

<option>Ice</option>
<option>Light</option>
<option>Life</option>
<option>Death</option>

</select>

<br>

<button onclick="startGame()">
Enter Everstar
</button>

</div>

<div id="ui">

<h2>Everstar</h2>

Guardian:
<span id="rank">
Apprentice
</span>

<br><br>

Star:
<span id="starName">
Unknown
</span>

<br><br>

Animals:
<span id="animalsFound">
0
</span>

<div id="message">

Choose your destiny.

</div>

</div>

<div id="regionLabel">
Region: Spawn
</div>

<div id="viewport">

<div id="game">

<div id="player">

<div
class="eye"
id="leftEye">
</div>

<div
class="eye"
id="rightEye">
</div>

</div>
<div
class="animal unicorn"
style="
left:500px;
top:700px;">
</div>

<div
class="animal lavawolf"
style="
left:1800px;
top:900px;">
</div>

<div
id="sage"
style="
left:2500px;
top:1200px;">
</div>

<div
id="region"
style="
left:400px;
top:600px;">
🦄 Unicorn Falls
</div>

<div
id="region"
style="
left:1650px;
top:700px;">
🌋 Dark Forest of Doom
</div>

<div
id="region"
style="
left:3100px;
top:400px;">
☁️ Air Region
</div>

<div
id="region"
style="
left:3300px;
top:2500px;">
🔥 Fire Region
</div>

<div
id="region"
style="
left:1200px;
top:3000px;">
🌿 Earth Region
</div>

<div
id="region"
style="
left:400px;
top:2600px;">
🌊 Water Region
</div>

</div>
</div>

<div id="joystick">
<div id="stick"></div>
</div>
<script>

const player =
document.getElementById("player");

const game =
document.getElementById("game");

let x = 200;
let y = 200;

let animalsFound = 0;

let playerElement = "";
let birthStar = "";

let pets = [];

const stars = [
"Aurora",
"Nova",
"Celestia",
"Astrid",
"Solara",
"Eclipse",
"Vega",
"Lunaris"
];

function startGame(){

playerElement =
document.getElementById(
"element"
).value;

const colors = {

Fire:"orange",
Water:"blue",
Earth:"green",
Air:"white",

Ice:"silver",
Light:"gold",
Life:"lime",
Death:"black"

};

document
.querySelectorAll(".eye")
.forEach(eye=>{

eye.style.background =
colors[playerElement];

});

birthStar =
stars[
Math.floor(
Math.random()*
stars.length
)
];

document
.getElementById("starName")
.innerText = birthStar;

document
.getElementById(
"characterScreen"
).style.display="none";

showMessage(
"Your star is "
+ birthStar
);

}

function showMessage(text){

document
.getElementById("message")
.innerText = text;

}

function updateCamera(){

const w =
window.innerWidth;

const h =
window.innerHeight;

let camX =
x - w/2;

let camY =
y - h/2;

camX =
Math.max(
0,
Math.min(
camX,
4000-w
)
);

camY =
Math.max(
0,
Math.min(
camY,
4000-h
)
);

game.style.transform=
`translate(
${-camX}px,
${-camY}px
)`;

}

function updatePlayer(){

x=Math.max(
0,
Math.min(x,3940)
);

y=Math.max(
0,
Math.min(y,3940)
);

player.style.left =
x+"px";

player.style.top =
y+"px";

updateCamera();
checkAnimals();
checkNPC();
checkRegion();

}

function gainPet(name){

pets.push(name);

showMessage(
name +
" joined your team!"
);

}

function checkAnimals(){

document
.querySelectorAll(".animal")
.forEach(animal=>{

if(
animal.dataset.found
)
return;

const dx =
x-animal.offsetLeft;

const dy =
y-animal.offsetTop;

const dist =
Math.sqrt(
dx*dx+dy*dy
);

if(dist<80){

animal.dataset.found=true;

animalsFound++;

document
.getElementById(
"animalsFound"
).innerText=
animalsFound;

if(
animal.classList.contains(
"unicorn"
)
){
gainPet("Unicorn");
}

if(
animal.classList.contains(
"lavawolf"
)
){
gainPet("Lava Wolf");
}

if(
animalsFound>=2
){

document
.getElementById(
"rank"
).innerText=
"Junior Guardian";

showMessage(
"You became a Junior Guardian!"
);

}

animal.style.display=
"none";

}

});

}

function checkNPC(){

const sage =
document.getElementById(
"sage"
);

const dx =
x-sage.offsetLeft;

const dy =
y-sage.offsetTop;

const dist =
Math.sqrt(
dx*dx+dy*dy
);

if(dist<100){

showMessage(
"Sage: The Bronze Phoenix still lives..."
);

}

}

function checkRegion(){

let region="Wilderness";

if(x<1000 && y<1200)
region="Unicorn Falls";

if(x>1500&&x<2500)
region="Dark Forest of Doom";

if(x>2800&&y<1000)
region="Air Region";

if(x>2800&&y>1800)
region="Fire Region";

if(x<1000&&y>2200)
region="Water Region";

if(x>800&&x<2000&&y>2500)
region="Earth Region";

document
.getElementById(
"regionLabel"
).innerText=
"Region: "
+region;

}

document.addEventListener(
"keydown",
e=>{

const speed=15;

if(e.key==="ArrowUp")
y-=speed;

if(e.key==="ArrowDown")
y+=speed;

if(e.key==="ArrowLeft")
x-=speed;

if(e.key==="ArrowRight")
x+=speed;

updatePlayer();

}
);

const joystick =
document.getElementById(
"joystick"
);

const stick =
document.getElementById(
"stick"
);

let joyX=0;
let joyY=0;
let dragging=false;

joystick.addEventListener(
"touchstart",
()=>{
dragging=true;
}
);

joystick.addEventListener(
"touchmove",
e=>{

if(!dragging)
return;

const t=e.touches[0];

const rect=
joystick.getBoundingClientRect();

let dx=
t.clientX-
(rect.left+60);

let dy=
t.clientY-
(rect.top+60);

let dist=
Math.sqrt(
dx*dx+dy*dy
);

if(dist>40){

dx=
dx/dist*40;

dy=
dy/dist*40;

}

joyX=dx;
joyY=dy;

stick.style.left=
(30+dx)+"px";

stick.style.top=
(30+dy)+"px";

},
{passive:false}
);

joystick.addEventListener(
"touchend",
()=>{

dragging=false;

joyX=0;
joyY=0;

stick.style.left=
"30px";

stick.style.top=
"30px";

}
);

function loop(){

x+=joyX*0.12;
y+=joyY*0.12;

updatePlayer();

requestAnimationFrame(
loop
);

}

loop();

</script>

</body>
</html>
