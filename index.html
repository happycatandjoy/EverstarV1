<script>

let x = 200;
let y = 200;

let joyX = 0;
let joyY = 0;

let dragging = false;

let animalsFound = 0;

let playerElement = "";
let birthStar = "";

let pets = [];

const stars = [
"Aurora",
"Nova",
"Celestia",
"Lunaris",
"Astrid",
"Eclipse",
"Vega",
"Solara"
];

const girlNames = [
"Luna",
"Aurora",
"Willow",
"Nova",
"Iris",
"Ruby",
"Aria",
"Violet",
"Celeste",
"Sophia"
];

const boyNames = [
"Orion",
"Atlas",
"Leo",
"Finn",
"Jasper",
"Ash",
"Rowan",
"Elliot",
"Theo",
"Felix"
];

const hiddenElements = [
"Fire",
"Water",
"Earth",
"Air",
"Ice",
"Light",
"Life",
"Death"
];

const player =
document.getElementById("player");

const game =
document.getElementById("game");

const message =
document.getElementById("message");

function randomCharacter(){

const gender =
Math.random() < 0.5
?
"Girl"
:
"Boy";

document
.getElementById(
"gender"
)
.value =
gender;

const names =
gender === "Girl"
?
girlNames
:
boyNames;

document
.getElementById(
"playerName"
)
.value =
names[
Math.floor(
Math.random() *
names.length
)
];

const hairstyles = [
"Short",
"Long",
"Spiky",
"Ponytail",
"Curly",
"Braids"
];

document
.getElementById(
"hairStyle"
)
.value =
hairstyles[
Math.floor(
Math.random() *
hairstyles.length
)
];

document
.getElementById(
"hairColor"
)
.value =
"#5c3a21";

updatePreview();

}

function updateHairStyle(){

const style =
document
.getElementById(
"hairStyle"
)
.value;

const hair =
document
.getElementById(
"previewHair"
);

hair.style.height =
"20px";

hair.style.borderRadius =
"15px";

hair.style.clipPath = "";

switch(style){

case "Long":
hair.style.height =
"45px";
break;

case "Spiky":
hair.style.height =
"30px";

hair.style.clipPath =
"polygon(0 100%,10% 15%,20% 100%,35% 5%,50% 100%,65% 10%,80% 100%,90% 20%,100% 100%)";

break;

case "Ponytail":
hair.style.height =
"35px";
break;

case "Curly":
hair.style.height =
"30px";
hair.style.borderRadius =
"50%";
break;

case "Braids":
hair.style.height =
"40px";
break;
}

}

function updatePreview(){

const skin =
document
.getElementById(
"skinTone"
)
.value;

const hairColor =
document
.getElementById(
"hairColor"
)
.value;

const topColor =
document
.getElementById(
"topColor"
)
.value;

const pantsColor =
document
.getElementById(
"pantsColor"
)
.value;

const shoeColor =
document
.getElementById(
"shoeColor"
)
.value;

const outfit =
document
.getElementById(
"outfitType"
)
.value;

document
.getElementById(
"previewHead"
)
.style.background =
skin;

document
.getElementById(
"previewHair"
)
.style.background =
hairColor;

document
.getElementById(
"previewBody"
)
.style.background =
topColor;

document
.getElementById(
"previewLegs"
)
.style.background =
pantsColor;

document
.getElementById(
"previewShoes"
)
.style.background =
shoeColor;

document
.getElementById(
"previewDress"
)
.style.background =
"transparent";

document
.getElementById(
"previewJacket"
)
.style.background =
"transparent";

if(
outfit === "Dress"
){

document
.getElementById(
"previewDress"
)
.style.background =
topColor;

}

if(
outfit === "Jacket"
){

document
.getElementById(
"previewJacket"
)
.style.background =
topColor;

}

updateHairStyle();
}

function startGame(){

const name =
document
.getElementById(
"playerName"
)
.value ||
"Traveler";

document
.getElementById(
"playerDisplayName"
)
.innerText =
name;

playerElement =
hiddenElements[
Math.floor(
Math.random() *
hiddenElements.length
)
];

birthStar =
stars[
Math.floor(
Math.random() *
stars.length
)
];

document
.getElementById(
"starName"
)
.innerText =
birthStar;

document
.getElementById(
"characterScreen"
)
.style.display =
"none";

document
.getElementById(
"playerHair"
)
.style.background =
document
.getElementById(
"hairColor"
)
.value;

document
.getElementById(
"playerHead"
)
.style.background =
document
.getElementById(
"skinTone"
)
.value;

document
.getElementById(
"playerBody"
)
.style.background =
document
.getElementById(
"topColor"
)
.value;

document
.getElementById(
"playerLegs"
)
.style.background =
document
.getElementById(
"pantsColor"
)
.value;

document
.getElementById(
"playerShoes"
)
.style.background =
document
.getElementById(
"shoeColor"
)
.value;

const outfit =
document
.getElementById(
"outfitType"
)
.value;

if(outfit==="Dress"){

document
.getElementById(
"playerDress"
)
.style.background =
document
.getElementById(
"topColor"
)
.value;

}

if(outfit==="Jacket"){

document
.getElementById(
"playerJacket"
)
.style.background =
document
.getElementById(
"topColor"
)
.value;

}

showMessage(
"Your star is " +
birthStar +
"."
);

}

function showMessage(text){

message.innerText =
text;

}

function updateCamera(){

const w =
window.innerWidth;

const h =
window.innerHeight;

let camX =
x - w/2;

let camY =
y - h/2;

camX =
Math.max(
0,
Math.min(
camX,
4000-w
)
);

camY =
Math.max(
0,
Math.min(
camY,
4000-h
)
);

game.style.transform =
`translate(${-camX}px,${-camY}px)`;

}

function checkAnimals(){

document
.querySelectorAll(
".animal"
)
.forEach(animal=>{

if(
animal.dataset.found
)
return;

const dx =
x -
animal.offsetLeft;

const dy =
y -
animal.offsetTop;

const dist =
Math.sqrt(
dx*dx +
dy*dy
);

if(dist < 80){

animal.dataset.found =
true;

animal.style.display =
"none";

animalsFound++;

document
.getElementById(
"animalsFound"
)
.innerText =
animalsFound;

if(
animal.classList
.contains(
"unicorn"
)
){
pets.push(
"Unicorn"
);

showMessage(
"🦄 Unicorn joined your team!"
);
}

if(
animal.classList
.contains(
"lavawolf"
)
){
pets.push(
"Lava Wolf"
);

showMessage(
"🐺 Lava Wolf joined your team!"
);
}

if(
animalsFound >= 2
){

document
.getElementById(
"rank"
)
.innerText =
"Junior Guardian";

showMessage(
"👑 You became a Junior Guardian!"
);

}

}

});

}

function checkNPCs(){

document
.querySelectorAll(
".npc"
)
.forEach(npc=>{

const dx =
x -
npc.offsetLeft;

const dy =
y -
npc.offsetTop;

const dist =
Math.sqrt(
dx*dx +
dy*dy
);

if(dist < 100){

if(
npc.id === "sage"
){

showMessage(
"The Bronze Phoenix still lives..."
);

}

if(
npc.id === "keeper"
){

showMessage(
"The unicorns know secrets."
);

}

if(
npc.id === "ranger"
){

showMessage(
"Something lurks in the forest."
);

}

}

});

}

function updateRegion(){

let region =
"Wilderness";

if(x < 1200 && y < 1200)
region =
"Unicorn Falls";

if(x > 1500 && x < 2600)
region =
"Dark Forest of Doom";

if(x > 2600 && y < 1200)
region =
"Air Region";

if(x > 2800 && y > 1800)
region =
"Fire Region";

if(x < 1000 && y > 2200)
region =
"Water Region";

if(
x > 800 &&
x < 2000 &&
y > 2500
)
region =
"Earth Region";

document
.getElementById(
"regionLabel"
)
.innerText =
"Region: " +
region;

}

function updatePlayer(){

x =
Math.max(
0,
Math.min(
x,
3940
)
);

y =
Math.max(
0,
Math.min(
y,
3940
)
);

player.style.left =
x + "px";

player.style.top =
y + "px";

updateCamera();

checkAnimals();

checkNPCs();

updateRegion();

}

document
.addEventListener(
"keydown",
e=>{

const speed = 12;

if(e.key==="ArrowUp")
y-=speed;

if(e.key==="ArrowDown")
y+=speed;

if(e.key==="ArrowLeft")
x-=speed;

if(e.key==="ArrowRight")
x+=speed;

updatePlayer();

}
);

const joystick =
document.getElementById(
"joystick"
);

const stick =
document.getElementById(
"stick"
);

joystick
.addEventListener(
"touchstart",
()=>{
dragging = true;
}
);

joystick
.addEventListener(
"touchmove",
e=>{

if(!dragging)
return;

const touch =
e.touches[0];

const rect =
joystick.getBoundingClientRect();

let dx =
touch.clientX -
(rect.left+60);

let dy =
touch.clientY -
(rect.top+60);

const dist =
Math.sqrt(
dx*dx +
dy*dy
);

if(dist > 40){

dx =
dx/dist*40;

dy =
dy/dist*40;

}

joyX = dx;
joyY = dy;

stick.style.left =
(30+dx)+"px";

stick.style.top =
(30+dy)+"px";

},
{
passive:false
}
);

joystick
.addEventListener(
"touchend",
()=>{

dragging = false;

joyX = 0;
joyY = 0;

stick.style.left =
"30px";

stick.style.top =
"30px";

}
);

function gameLoop(){

x += joyX * 0.12;
y += joyY * 0.12;

updatePlayer();

requestAnimationFrame(
gameLoop
);

}

document
.querySelectorAll(
"select,input"
)
.forEach(control=>{

control
.addEventListener(
"input",
updatePreview
);

});

randomCharacter();

updatePreview();

gameLoop();

</script>

</body>
</html>
